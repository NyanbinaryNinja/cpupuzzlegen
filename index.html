<!DOCTYPE html>
<html lang="en">
<head>
<style>
body{background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:monospace;margin:0;min-height:100vh;padding:20px;box-sizing:border-box}
canvas{margin-top:190px;box-shadow:0 0 20px #0f43;max-width:100%;height:auto}
#cipher_type{position:absolute;top:20px;left:20px}

label, #cipher_type, #theme_sel, #c_pick {
  color: initial !important;
}


input[type="checkbox"] {
  appearance: auto !important;
  -webkit-appearance: checkbox !important;
  -moz-appearance: checkbox !important;
}
</style>

<script src="js/general/input_filter.js"></script>
<script src="js/general/theme_manager.js"></script>
<script src="js/general/gif_generator.js"></script>
<script src="js/general/grid_maker.js"></script>
<script src="js/general/flag_generator.js"></script>

<script src="js/ciphers/polybius.js"></script>
<script src="js/ciphers/pigpen.js"></script>
<script src="js/ciphers/radar.js"></script>

<script src="https://cdn.jsdelivr.net/npm/gif.js/dist/gif.js"></script>
<link rel="stylesheet" href="https://unpkg.com/xp.css@0.2.3/dist/98.css" />

<script src="js/app.js" defer></script>

</head>
<body>
<div class="window" style="position:absolute;top:20px;left:20px;width:300px;">
  <div class="title-bar">
    <div class="title-bar-text">Flag Generator</div>
    <div class="title-bar-controls">
      <button aria-label="Minimize"></button>
      <button aria-label="Maximize"></button>
      <button aria-label="Close"></button>
    </div>
  </div>
  <div class="window-body">
    <fieldset style="margin-bottom: 5px;"><label for="prefix_input">Prefix:</label><input type="text" id="prefix_input" value=""></fieldset>
    <fieldset style="margin-bottom: 5px;"><label for="flag_input">Flag:</label><input type="text" id="flag_input" value=""></fieldset>
    <fieldset style="margin-bottom: 5px;"><button onclick="generate_custom_flag()">Generate Flag</button></fieldset>
    <fieldset style="margin-bottom: 5px;"><label for="flag_output">Output:</label><input type="text" id="flag_output" readonly></fieldset>
    <fieldset><input type="checkbox" id="add_to_cipher_cb"><label for="add_to_cipher_cb"> Add to cipher input</label></fieldset>
  </div>
</div>
<div class="window" style="position:absolute;top:20px;left:50%;transform:translateX(-50%);width:340px;height:150px;margin:10px 0;">
  <div class="title-bar">
    <div class="title-bar-text">Controls</div>
    <div class="title-bar-controls">
      <button aria-label="Minimize"></button>
      <button aria-label="Maximize"></button>
      <button aria-label="Close"></button>
    </div>
  </div>
  <div class="window-body" style="text-align: center; display: flex; flex-direction: column; align-items: center;">
    <fieldset style="margin-bottom: 10px; border: none; padding: 0;">
      <label for="cipher_type">Cipher Type:</label><br>
      <select id="cipher_type" onchange="generate_grid()">
        <option value="poly">Polybius Square</option>
        <option value="pig">Pigpen Cipher</option>
        <option value="radar">Radar</option>
      </select>
    </fieldset>
    <fieldset style="margin-bottom: 10px; border: none; padding: 0;">
      <input id="input_box" value="" placeholder="Enter text here...">
    </fieldset>
    <fieldset style="border: none; padding: 0;">
      <button onclick="generate_grid()">Generate Grid</button>
      <button id="rec_btn" onclick="start_recording()">Record File</button>
    </fieldset>
  </div>
</div>
<div class="window" style="position:absolute;top:20px;right:20px;width:300px;">
  <div class="title-bar">
    <div class="title-bar-text">Options</div>
    <div class="title-bar-controls">
      <button aria-label="Minimize"></button>
      <button aria-label="Maximize"></button>
      <button aria-label="Close"></button>
    </div>
  </div>
  <div class="window-body">
    <fieldset style="margin-bottom:10px;">
      <label for="theme_sel">Theme:</label>
      <select id="theme_sel" onchange="document.getElementById('c_pick').style.display=this.value=='6'?'inline-block':'none'">
        <option value="1">Neon Green</option>
        <option value="2">Gold (Winton)</option>
        <option value="3">Dark Red (Remed)</option>
        <option value="4">Cyan (Muny)</option>
        <option value="5">Rainbow Gradient (Moggers)</option>
        <option value="6">Colour Picker</option>
      </select>
      <input type="color" id="c_pick" value="#00ff44" style="display:none;height:22px;padding:0;border:none;">
    </fieldset>
    <div id="opt_poly" style="display:none;"><fieldset><input type="checkbox" id="poly_num_cb" onchange="generate_grid()" checked><label for="poly_num_cb"> Show Numbers</label></fieldset></div>
    <div id="opt_radar" style="display:none;"><fieldset><input type="checkbox" id="radar_clock_cb" onchange="generate_grid()" checked><label for="radar_clock_cb"> Show Clock Guide</label></fieldset></div>
    <div><fieldset><input type="checkbox" id="split_cb"><label for="split_cb"> Split Key & Grid</label></fieldset></div>
  </div>
</div>
<canvas id="canvas_el"></canvas>
</body>
</html>
